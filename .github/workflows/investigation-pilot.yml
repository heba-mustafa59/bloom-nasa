name: Investigation pilot checks
on:
  push:
    branches: [feature/investigation-case-pilot]
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile investigation_app.py ui_app.py modules/investigation_case.py modules/area_advisor.py modules/ui_pilot_context.py modules/ui_pages/explore_pilot.py modules/ui_pages/explore.py modules/ui_pages/reports.py
      - name: Test
        run: python -m pytest tests/test_investigation_case_pilot.py tests/test_area_advisor.py tests/test_main_site_pilot.py -q
